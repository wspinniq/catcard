// 正式卡圖讀取方式：將 card01.png / card02.jpg / card03.jpeg ... 放在 HTML 相同資料夾。
// Chrome 不允許一般網頁直接列出檔案夾，故依序嘗試支援的副檔名，不需要伺服器 API。
const imageExtensions=['png','jpg','jpeg','PNG','JPG','JPEG'];
const cardImageCache=new Map();
function lookupCardImage(cardId,done){
 let item=cardImageCache.get(cardId);
 if(item){
  if(item.status==='loading')item.callbacks.push(done);
  else done(item.src);
  return;
 }
 item={status:'loading',src:null,callbacks:[done]};
 cardImageCache.set(cardId,item);
 let at=0;
 function finish(url){
  item.src=url;item.status=url?'found':'missing';
  const callbacks=item.callbacks.splice(0);
  callbacks.forEach(cb=>cb(url));
 }
 function next(){
  if(at>=imageExtensions.length){finish(null);return}
  const path=`card${num(cardId)}.${imageExtensions[at++]}`;
  const probe=new Image();
  probe.onload=()=>finish(path);
  probe.onerror=next;
  probe.src=path;
 }
 next();
}
function cardArt(c){
 // 無正式圖片時只顯示 loading，不產生任何 SVG 插圖。
 return `<div class="art" data-card-id="${c.id}" aria-label="${escapeHtml(c.name)} 的圖片"><span class="art-loading">loading</span><img class="external-card-image" alt="${escapeHtml(c.name)} 的正式卡圖" loading="lazy" decoding="async"></div>`;
}
function hydrateCardImages(root=document){
 root.querySelectorAll('.art[data-card-id]').forEach(el=>{
  if(el.dataset.imageBound==='1')return;
  el.dataset.imageBound='1';
  const img=el.querySelector('.external-card-image');
  if(!img)return;
  lookupCardImage(Number(el.dataset.cardId),url=>{
   if(!url||!img.isConnected)return;
   const show=()=>{if(!img.isConnected)return;el.classList.add('has-external')};
   img.addEventListener('load',show,{once:true});
   img.addEventListener('error',()=>el.classList.remove('has-external'),{once:true});
   img.src=url;
   if(img.complete&&img.naturalWidth>0)show();
  });
 });
}
function header(){return `<div class="stars"></div><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">☾</div><div><div class="brand-name">貓咪老師直覺神諭卡</div><div class="brand-sub">36 CATS ORACLE</div></div></div><span class="top-pill">✦ 36 張命運牌</span></header>`}
function setupView(){return `
 <div class="eyebrow">⋆˚✦　THE CAT KNOWS　✦˚⋆</div>
 <h1 class="heading serif">今天，聽聽貓咪老師<br>想對你說什麼</h1>
 <p class="intro">36 張神諭卡，將生活裡的每個小動作，<br>變成一份溫柔的直覺提醒。</p>
 <div class="hero-art"><div class="halo"></div><div class="orbit"></div><div class="hero-back1"></div><div class="hero-back2"></div><div class="hero-card"><span class="hero-loading">loading</span></div></div>
 <section class="panel" aria-label="開始占卜設定">
 <label class="form-label" for="question">✧ 想向老師提出什麼問題？</label>
 <textarea id="question" placeholder="例如：我現在適合轉換工作方向嗎？\n也可以留白，領取今天的直覺啟示。" maxlength="240">${escapeHtml(state.question)}</textarea>
 <div class="section-label" style="margin:14px 1px 5px">提問主題</div>
 <div class="chips">${topics.map(([key,name])=>`<button class="chip ${key===state.topic?'active':''}" data-action="topic" data-topic="${key}" aria-pressed="${key===state.topic}">${name}</button>`).join('')}</div>
 <div class="section-label">選擇牌陣</div>
 <div class="mode-grid">${[1,3,5].map(n=>`<button class="mode ${state.mode===n?'active':''}" data-action="mode" data-mode="${n}" aria-pressed="${state.mode===n}"><div class="mode-symbol">${n===1?'✦':n===3?'✦ ✦ ✦':'✧ ✦ ✧'}</div><div class="mode-title">${n} 張牌</div><div class="mode-sub">${['', '當下啟示','','命運連線','','命運十字'][n]}</div></button>`).join('')}</div>
 <div class="space"></div><button class="primary" data-action="start">開始洗牌　✦</button>
 <p class="hint center" style="margin:11px 0 0">請靜下心來，選擇最吸引你的牌。</p>
 </section>
 <p class="note">這是一款結合象徵聯想與自我反思的療癒遊戲，<br>牌卡不是確定的未來預言，也不代替重要的現實判斷。</p>`}
function selectionTray(){return Array.from({length:state.mode},(_,i)=>`<div class="picked-slot ${i<state.selected.length?'filled':''}" aria-label="${i<state.selected.length?'已選擇':'空白'}第${i+1}張">${i<state.selected.length?'✦':i+1}</div>`).join('')}
function pickView(){return `
 <div class="eyebrow">THE DECK IS IN YOUR HANDS</div>
 <h1 class="heading-sm serif">命運，藏在貓掌之間</h1>
 <p class="intro">36 張卡牌已重新洗好。<br>依照第一直覺，點選 <b style="color:var(--gold)">${state.mode}</b> 張命運牌。</p>
 ${state.question?`<div class="status-banner">你的提問：${escapeHtml(state.question)}</div>`:''}
 <div class="progress-bar"><div id="progress-fill" style="width:${state.selected.length/state.mode*100}%"></div></div>
 <div class="deck-count" aria-live="polite">已選擇 <b id="selected-count">${state.selected.length}</b> / ${state.mode} 張</div>
 <div class="picked-strip" id="selection-tray">${selectionTray()}</div>
 <div class="deck-grid" aria-label="36 張面朝下的神諭卡">${state.deck.map((cardId,i)=>`<button class="pick-card ${state.selected.includes(cardId)?'selected':''}" data-action="pick" data-id="${cardId}" aria-label="選取第 ${i+1} 個卡牌位置" aria-pressed="${state.selected.includes(cardId)}"><span class="paw" aria-hidden="true">♣</span></button>`).join('')}</div>
 <button id="reveal-btn" class="primary" data-action="reveal" ${state.selected.length===state.mode?'':'disabled'}>揭開貓咪老師的啟示　✧</button>
 <div style="display:flex;justify-content:space-evenly;margin:9px 0 0"><button class="line-link" data-action="clear-pick">重新選牌</button><button class="line-link" data-action="reshuffle">重新洗牌</button></div>
 <p class="note">每一次都從 36 張牌中不重複抽取。<br>點選已選取的卡牌可取消選擇。</p>`}
function faceCard(c,i,role){return `<button class="face-item" data-action="detail" data-id="${c.id}" style="--delay:${i*120}ms" aria-label="查看 ${c.name} 的完整牌義"><div class="face-number">NO. ${num(c.id)}</div>${cardArt(c)}<div class="face-name">${escapeHtml(c.name)}</div><div class="face-role">${escapeHtml(role)}</div></button>`}
function resultView(){const picks=state.result,roles=modes[state.mode][1];if(!picks.length)return setupView();
 const pairBlocks=picks.slice(0,-1).map((a,i)=>`<div class="pair-block"><div class="pair-name">${escapeHtml(a.name)}　×　${escapeHtml(picks[i+1].name)}</div>${escapeHtml(pairText(a,picks[i+1]))}</div>`).join('');
 return `<div class="eyebrow">✧ YOUR CAT ORACLE ✧</div><h1 class="heading-sm serif">貓咪老師的命運啟示</h1>
 <div class="center"><span class="topic-flag">${escapeHtml(topicName(state.topic))} ・ ${state.mode} 張牌</span></div>
 <p class="intro" style="margin-top:10px">${state.question?`「${escapeHtml(state.question)}」`:'「今天，我需要留意什麼？」'}</p>
 <div class="face-grid ${picks.length===1?'one':''}">${picks.map((c,i)=>faceCard(c,i,roles[i])).join('')}</div>
 <p class="hint center">輕觸卡牌，可放大查看畫面與完整牌義。</p>
 <div class="ornament"></div>
 <section class="read-block"><div class="read-title">✦　每張牌想告訴你</div>${picks.map((c,i)=>`<div class="role-block"><div class="role-head"><span class="role-count">${i+1}</span><strong>${escapeHtml(c.name)}</strong><span>· ${escapeHtml(roles[i])}</span></div><p>${escapeHtml(roleInterpretation(c,roles[i],state.topic))}</p></div>`).join('')}</section>
 ${picks.length>1?`<div class="space-sm"></div><section class="read-block"><div class="read-title">✦　卡牌之間的悄悄話</div>${pairBlocks}</section>`:''}
 <div class="space-sm"></div><section class="read-block"><div class="read-title">✦　屬於你的整體啟示</div><p>${escapeHtml(overviewFor(picks,state.topic))}</p><div class="summary-quote">「${escapeHtml(picks[picks.length-1].quote)}」</div><p><strong style="color:#f0d4a1">留給你的問題：</strong>${escapeHtml(reflectionFor(picks))}</p></section>
 <div class="space"></div><div class="result-actions" aria-label="占卜操作"><button class="secondary" data-action="copy">複製解讀文字</button><button class="primary" data-action="restart">再次抽牌　✦</button></div>
 <p class="note">貓咪老師指引提供的是探索角度，不代表確定事件或必然結果。<br>涉及醫療、財務等重要選擇，請以專業資訊和現實條件為準。</p>`}
function render(){document.getElementById('app').innerHTML=header()+`<main>${state.stage==='setup'?setupView():state.stage==='pick'?pickView():resultView()}</main>`;hydrateCardImages()}
function topScroll(){window.scrollTo({top:0,behavior:'instant'})}
function showToast(message){document.querySelectorAll('.toast').forEach(el=>el.remove());let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function start(){const q=document.getElementById('question');state.question=q?q.value.trim():state.question.trim();state.deck=shuffle(cards.map(c=>c.id));state.selected=[];state.stage='pick';render();topScroll()}
function syncSelection(){const n=state.selected.length;document.getElementById('selected-count').textContent=n;document.getElementById('progress-fill').style.width=`${n/state.mode*100}%`;document.getElementById('selection-tray').innerHTML=selectionTray();document.getElementById('reveal-btn').disabled=n!==state.mode;document.querySelectorAll('.pick-card').forEach(el=>{const s=state.selected.includes(+el.dataset.id);el.classList.toggle('selected',s);el.setAttribute('aria-pressed',String(s))});if(n===state.mode)showToast('喵～卡牌都選好了！可以翻牌囉 ✦')}
function pick(id){if(state.selected.includes(id))state.selected=state.selected.filter(v=>v!==id);else if(state.selected.length<state.mode)state.selected.push(id);else{showToast('已選滿卡牌，點選已選牌可取消喵');return}syncSelection()}
function reveal(){if(state.selected.length!==state.mode)return;state.result=state.selected.map(getCard);state.stage='result';render();topScroll()}
function openModal(html){document.querySelector('.modal-overlay')?.remove();const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="卡牌資訊"><div class="modal-grab"></div><button class="modal-close" data-action="close-modal" aria-label="關閉">×</button>${html}</section>`;document.body.appendChild(overlay);document.body.style.overflow='hidden';hydrateCardImages(overlay)}
function closeModal(){document.querySelector('.modal-overlay')?.remove();document.body.style.overflow=''}
function detail(id){const c=getCard(id);if(!c)return;const g=groups[c.group];openModal(`<div class="sheet-card-title"><div class="number">${num(c.id)}</div><div><div class="group">${escapeHtml(g.name)} ・ ${toneMeaning[c.tone]}</div><h3>${escapeHtml(c.name)}</h3></div></div><div class="modal-art">${cardArt(c)}</div><div class="pill-row">${c.keys.map(k=>`<span class="tag">${escapeHtml(k)}</span>`).join('')}</div><div class="hint-card"><strong>畫面意象</strong><p>${escapeHtml(c.scene)}</p></div><div class="hint-card"><strong>占卜指引</strong><p>${escapeHtml(c.advice)}</p></div><div class="cat-quote">「${escapeHtml(c.quote)}」</div><div class="space-sm"></div><button class="secondary" data-action="close-modal">回到卡牌</button>`)}
async function copyReading(){const txt=readingText(state.result,state.topic,state.mode,state.question);let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);copied=true}}catch(e){}if(!copied){const area=document.createElement('textarea');area.value=txt;area.style.cssText='position:fixed;opacity:0;left:0;top:0';document.body.appendChild(area);area.focus();area.select();try{copied=document.execCommand('copy')}catch(e){}area.remove()}showToast(copied?'解讀已複製到剪貼簿':'無法自動複製，請改為長按文字複製')}

document.getElementById('app').addEventListener('click',event=>{
 const b=event.target.closest('[data-action]');if(!b)return;
 const action=b.dataset.action;
 if(action==='topic'){state.topic=b.dataset.topic;render()}
 else if(action==='mode'){state.mode=+b.dataset.mode;render()}
 else if(action==='start')start();
 else if(action==='pick')pick(+b.dataset.id);
 else if(action==='reveal')reveal();
 else if(action==='clear-pick'){state.selected=[];syncSelection()}
 else if(action==='reshuffle'){state.deck=shuffle(state.deck);state.selected=[];render();showToast('喵！已重新洗牌 ✦')}
 else if(action==='detail')detail(+b.dataset.id);
 else if(action==='copy')copyReading();
 else if(action==='restart'){state.stage='setup';state.selected=[];render();topScroll()}
});
document.getElementById('app').addEventListener('input',event=>{
 if(event.target.id==='question')state.question=event.target.value;
});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay')||e.target.closest('[data-action="close-modal"]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
